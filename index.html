<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Projektów ENPROM</title>
    <style>
        /* Reset marginesów, aby mapa zajmowała 100% ekranu bez białych ramek */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Zapobiega podwójnemu przewijaniu strony */
            font-family: Arial, sans-serif;
            background-color: #000; /* Czarne tło podczas ładowania mapy */
        }

        /* Główny kontener - teraz idealnie rozciąga się w dół i w bok */
        .map-container {
            position: relative;
            width: 100%;
            height: 100vh; /* 100% wysokości widocznego ekranu na telefonie */
            margin: 0;
            padding: 0;
        }

        /* Sama mapa z Google - wypełnia cały kontener */
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Panel z przyciskami nałożony na mapę */
        .floating-buttons {
            position: absolute;
            top: 70px; /* Przesunięte w dół, aby nie zasłaniać paska wyszukiwania Google Maps */
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999; /* Maksymalny priorytet warstwy, by przyciski były zawsze na wierzchu */
        }

        /* Wygląd pływających przycisków dopasowany do dotyku palcem */
        .phone-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px; /* Większy obszar kliknięcia (wygodniejsze na telefonie) */
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 25px; /* Zaokrąglone "pigułki" wyglądają nowocześniej */
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent; /* Usuwa brzydkie niebieskie podświetlenie w Safari/Chrome na telefonie */
        }

        /* Efekt kliknięcia palcem */
        .phone-btn:active {
            transform: scale(0.92);
        }

        /* Kolory przycisków */
        .kierownik {
            background-color: #007bff; /* Intensywny niebieski */
        }
        .bhp {
            background-color: #28a745; /* Intensywny zielony */
        }
    </style>
</head>
<body>

    <div class="map-container">
        
        <div class="floating-buttons">
            <a href="tel:+48123456789" class="phone-btn kierownik">
                📞 Kierownik
            </a>
            <a href="tel:+48987654321" class="phone-btn bhp">
                ⛑️ BHP
            </a>
        </div>

        <iframe src="https://www.google.com/maps/d/embed?mid=1-2Vs42j6F7k_9QnRxIeFYqiakHP8wHw&ehbc=2E312F" allowfullscreen="" loading="lazy"></iframe>

    </div>

</body>
</html>
