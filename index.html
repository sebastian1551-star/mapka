<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Projektów ENPROM</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
        }

        #map {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* POPUPY W KLIMACIE DARK MODE */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 15, 15, 0.95) !important;
            border: 1px solid #333;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 4px;
            color: #fff;
        }
        .leaflet-popup-tip { background: rgba(15, 15, 15, 0.95) !important; }

        .popup-container {
            text-align: center;
            min-width: 230px;
        }

        .popup-title {
            font-size: 14px;
            font-weight: bold;
            color: #24ff56;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .status-badge {
            font-size: 10px;
            font-weight: bold;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            background-color: #222;
            color: #aaa;
            border: 1px solid #444;
        }
        .status-staly { color: #ffc107; border-color: #ffc107; }
        .status-aktywne { color: #28a745; border-color: #28a745; }
        .status-nieaktywne { color: #ff4d4d; border-color: #ff4d4d; }

        /* Dane personelu w popupie */
        .popup-staff-info {
            font-size: 11px;
            color: #ccc;
            text-align: left;
            background: #222;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #333;
            line-height: 1.4;
        }

        .popup-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            padding: 11px;
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }
        .kierownik { 
            background-color: #0056b3; 
            margin-bottom: 4px;
        }
        .btn-dodaj-punkt { background-color: #28a745; }

        .custom-tooltip {
            background: rgba(20, 20, 20, 0.9) !important;
            border: 1px solid #444 !important;
            color: #fff !important;
            font-weight: 600;
            font-size: 10px;
            border-radius: 4px;
            padding: 2px 6px;
        }

        .user-location-marker {
            background: #007bff;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.7);
        }

        /* LATAJĄCY PRZYCISK: ZAPLANUJ TRASĘ */
        #btn-trigger-plan {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #444;
            color: #24ff56;
            padding: 14px 26px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* PANEL TRASY */
        #route-panel {
            position: absolute;
            bottom: -600px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 430px;
            background: rgba(15, 15, 15, 0.98);
            border: 1px solid #333;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 14px;
            z-index: 1000;
            transition: bottom 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
            box-sizing: border-box;
            color: #fff;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        #route-panel.active {
            bottom: 15px;
        }

        .route-tiles-scroll {
            overflow-y: auto;
            max-height: 260px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            padding: 4px;
            position: relative;
        }

        /* KAFELKI Z PEŁNĄ OBSŁUGĄ DOTYKU */
        .route-tile {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 12px 14px;
            gap: 12px;
            user-select: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            touch-action: none;
        }

        .route-tile.dragging {
            opacity: 0.9;
            background-color: #3d2475;
            border: 1px solid #9b5de5;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            transform: scale(1.02);
            z-index: 9999;
        }

        .tile-drag-handle {
            color: #888;
            font-size: 18px;
            cursor: grab;
            padding: 0 4px;
        }

        .tile-badge {
            font-size: 10px;
            font-weight: bold;
            background: #111;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
            border: 1px solid #333;
            min-width: 35px;
            text-align: center;
        }
        .tile-badge.badge-start { color: #24ff56; border-color: #24ff56; }
        .tile-badge.badge-meta { color: #ff4d4d; border-color: #ff4d4d; }

        .tile-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #fff;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-tile-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* INTERFEJS WYBORU KREATORA */
        .creator-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-creator-choice {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-creator-choice:active { background: #333; }

        .btn-add-next-step {
            background: rgba(111, 66, 193, 0.2);
            border: 1px dashed #6f42c1;
            color: #c58eff;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .quick-select-container {
            background: #161616;
            border-radius: 10px;
            border: 1px solid #333;
            padding: 6px;
            margin-bottom: 10px;
        }

        .quick-select-menu {
            width: 100%;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .panel-distance {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: #5c2bab;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .btn-go-route {
            background: #218838;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        
        .btn-clear-route {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <button id="btn-trigger-plan" onclick="otworzPlaner()">🗺️ Zaplanuj trasę</button>

    <div id="route-panel">
        
        <div class="route-tiles-scroll" id="tiles-container"></div>

        <button class="btn-add-next-step" id="btn-add-step" onclick="pokazOpcjeKreatora()" style="display:none;">
            ➕ Dodaj kolejny punkt trasy
        </button>

        <div class="creator-options" id="creator-box">
            <div style="font-size:11px; color:#aaa; margin-bottom:4px; font-weight:bold;" id="creator-title">
                WYBIERZ PUNKT POCZĄTKOWY TRASY:
            </div>
            <button class="btn-creator-choice" onclick="dodajGpsKreator()">📍 Moja aktualna lokalizacja</button>
            <button class="btn-creator-choice" onclick="dodajSiedzibeKreator()">🏢 Siedziba główna</button>
            
            <div class="quick-select-container">
                <select class="quick-select-menu" id="select-project-picker" onchange="wybranoZListyKreatora(this)">
                    <option value="" disabled selected>📋 Wybierz projekt z listy...</option>
                </select>
            </div>
            <div style="font-size:10px; color:#666; text-align:center; margin-top:-4px;">
                💡 Możesz też po prostu kliknąć dowolny punkt na mapie!
            </div>
        </div>

        <div class="panel-distance" id="route-distance">Uzupełnij punkty trasy...</div>
        <a href="#" target="_blank" class="btn-go-route" id="btn-google-maps" style="display:none;">🚗 Uruchom nawigację w Google Maps</a>
        <button class="btn-clear-route" onclick="zamknijIResetuj()">❌ Zamknij / Resetuj planer</button>
    </div>

    <script>
        const map = L.map('map', { zoomSnap: 0.5 });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        function stworzIkone(typ, status) {
            let url = "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png";
            if (typ === "SE") url = "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png";
            return L.icon({
                iconUrl: url, iconSize: [22, 36], iconAnchor: [11, 36], popupAnchor: [1, -30],
                className: status === "nieaktywne" ? "projekt-nieaktywny" : ""
            });
        }

        // Baza z przywróconymi polami personelu (Kierownik, BHP)
        const projekty = [
            { id: 1, typ: "LN", status: "aktywne", nazwa: "110 KV Bolesławiec - Świętoszów", etykieta: "244312 Bolesławiec", lat: 51.287194, lng: 15.594056, kierownik: "Jan Kowalski", bhp: "Andrzej Nowak" },
            { id: 2, typ: "SE", status: "aktywne", nazwa: "SE 400/110 kV Rokitnica", etykieta: "245165 Rokitnica", lat: 50.372361, lng: 18.771306, kierownik: "Michał Wiśniewski", bhp: "Andrzej Nowak" },
            { id: 3, typ: "LN", status: "aktywne", nazwa: "Linia 110/220 kV CPK", etykieta: "CPK", lat: 52.209911, lng: 20.475766, kierownik: "Tomasz Lewandowski", bhp: "Piotr Zieliński" },
            { id: 4, typ: "SE", status: "aktywne", nazwa: "SE Leszno", etykieta: "Leszno", lat: 51.877000, lng: 16.589056, kierownik: "Krzysztof Wójcik", bhp: "Piotr Zieliński" },
            { id: 5, typ: "SE", status: "aktywne", nazwa: "SE Polkowice", etykieta: "Polkowice", lat: 51.496195, lng: 16.073803, kierownik: "Marcin Kamiński", bhp: "Andrzej Nowak" },
            { id: 6, typ: "LN", status: "nieaktywne", nazwa: "Linia 110 kV Radzyń - Łuków", etykieta: "Radzyń", lat: 51.777073, lng: 22.622897, kierownik: "Brak aktywnych działań", bhp: "-" },
            { id: 7, typ: "UW", status: "aktywne", nazwa: "UW Siebenbäumen (Siedenbrunzow)", etykieta: "Siebenbrunzow", lat: 53.907861, lng: 13.144389, kierownik: "Nadzór zagraniczny", bhp: "Internat. Team" },
            { id: 8, typ: "UW", status: "nieaktywne", nazwa: "UW Semlin", etykieta: "Semlin", lat: 53.147361, lng: 11.758278, kierownik: "-", bhp: "-" },
            { id: 9, typ: "UW", status: "aktywne", nazwa: "UW Jesow", etykieta: "Jesow", lat: 53.389861, lng: 11.016417, kierownik: "Nadzór zagraniczny", bhp: "Internat. Team" },
            { id: 10, typ: "LN", status: "aktywne", nazwa: "LN Demon Munstenberg", etykieta: "Munstenberg", lat: 52.597977, lng: 13.623709, kierownik: "Paweł Zieliński", bhp: "Marek Woźniak" },
            { id: 11, typ: "LN", status: "aktywne", nazwa: "LN Trębaczew", etykieta: "Trębaczew", lat: 50.4571478, lng: 18.5353028, kierownik: "Robert Mazur", bhp: "Marek Woźniak" },
            { id: 12, typ: "LN", status: "staly", nazwa: "Magazyn Centralny", etykieta: "Magazyn Centralny", lat: 51.9420371, lng: 20.6014463, kierownik: "Logistyka MC", bhp: "Dział MC" },
            { id: 13, typ: "SE", status: "staly", nazwa: "Siedziba", etykieta: "Siedziba", lat: 52.1402252, lng: 21.0153614, kierownik: "Zarząd ENPROM", bhp: "Inspektor Centralny" },
            { id: 14, typ: "WF", status: "aktywne", nazwa: "Baltic Power", etykieta: "Baltic Power", lat: 54.7717892, lng: 17.9058547, kierownik: "Nadzór Offshore", bhp: "BHP Baltic Team" },
            { id: 15, typ: "WF", status: "aktywne", nazwa: "Bałtyk II&III", etykieta: "Bałtyk II&III", lat: 54.5432722, lng: 16.8494375, kierownik: "Nadzór Offshore", bhp: "BHP Baltic Team" }
        ];

        let punktyTrasy = [];
        let liniaTrasy = null;
        let aktualneWspolrzedneGps = null;
        const punktyDoKadrowania = [];

        const picker = document.getElementById('select-project-picker');
        projekty.forEach(projekt => {
            punktyDoKadrowania.push([projekt.lat, projekt.lng]);

            const opt = document.createElement('option');
            opt.value = projekt.id;
            opt.innerText = (projekt.status === 'staly' ? '📌 ' : '') + projekt.nazwa;
            picker.appendChild(opt);

            let statusTekst = projekt.status === "staly" ? "📌 PUNKT STAŁY" : (projekt.status === "aktywne" ? "🟢 W REALIZACJI" : "⚠️ UKOŃCZONO");
            
            // Generowanie pełnego popupu z danymi personalnymi (Kierownik, BHP) i przyciskiem akcji
            const popupContent = `
                <div class="popup-container">
                    <div class="popup-title">${projekt.nazwa}</div>
                    <div class="status-badge status-${projekt.status}">${statusTekst}</div>
                    
                    <div class="popup-staff-info">
                        👤 <strong>Kierownik:</strong> ${projekt.kierownik || 'Brak danych'}<br>
                        🦺 <strong>BHP:</strong> ${projekt.bhp || 'Brak danych'}
                    </div>

                    <button class="popup-btn kierownik" onclick="alert('Kontakt do nadzoru budowy: ${projekt.kierownik || 'Nie przypisano'}')">📞 Kontakt z Kierownikiem</button>
                    <button class="popup-btn btn-dodaj-punkt" onclick="dodajDoTrasyZId(${projekt.id})">➕ Dodaj do trasy</button>
                </div>
            `;

            const marker = L.marker([projekt.lat, projekt.lng], {
                icon: stworzIkone(projekt.typ, projekt.status),
                draggable: true
            }).addTo(map);

            marker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                projekt.lat = pos.lat;
                projekt.lng = pos.lng;
                punktyTrasy.forEach(p => {
                    if (p.dbId === projekt.id) { p.lat = pos.lat; p.lng = pos.lng; }
                });
                renderujTrase();
            });

            marker.bindTooltip((projekt.status === "staly" || projekt.typ === "WF") ? projekt.etykieta : `${projekt.typ}: ${projekt.etykieta}`, {
                permanent: true, direction: 'top', className: "custom-tooltip", offset: [0, -6]
            });
            marker.bindPopup(popupContent);
        });

        function otworzPlaner() {
            document.getElementById('btn-trigger-plan').style.display = 'none';
            document.getElementById('route-panel').classList.add('active');
            renderujTrase();
        }

        function pokazOpcjeKreatora() {
            document.getElementById('creator-title').innerText = "DODAJ KOLEJNY PUNKT TRASY:";
            document.getElementById('creator-box').style.display = 'flex';
            document.getElementById('btn-add-step').style.display = 'none';
        }

        function ukryjOpcjeKreatora() {
            document.getElementById('creator-box').style.display = 'none';
            document.getElementById('btn-add-step').style.display = 'flex';
        }

        function dodajDoTrasyZId(id) {
            const prj = projekty.find(p => p.id === id);
            if (prj) {
                punktyTrasy.push({ id: "prj_" + Date.now(), dbId: prj.id, nazwa: prj.nazwa, lat: prj.lat, lng: prj.lng });
                map.closePopup();
                if (!document.getElementById('route-panel').classList.contains('active')) otworzPlaner();
                renderujTrase();
            }
        }

        function wybranoZListyKreatora(select) {
            if (!select.value) return;
            dodajDoTrasyZId(parseInt(select.value));
            select.value = ""; 
        }

        function dodajGpsKreator() {
            if (aktualneWspolrzedneGps) {
                punktyTrasy.push({ id: "gps_" + Date.now(), nazwa: "📍 Moja lokalizacja (GPS)", lat: aktualneWspolrzedneGps.lat, lng: aktualneWspolrzedneGps.lng });
                renderujTrase();
            } else {
                alert("Wyszukuję sygnał GPS... Poczekaj chwilę.");
            }
        }

        function dodajSiedzibeKreator() {
            const s = projekty.find(p => p.id === 13);
            if (s) {
                punktyTrasy.push({ id: "siedziba_" + Date.now(), dbId: s.id, nazwa: "🏢 Siedziba główna", lat: s.lat, lng: s.lng });
                renderujTrase();
            }
        }

        function usunPunkt(index) {
            punktyTrasy.splice(index, 1);
            renderujTrase();
        }

        // UNIWERSALNY SYSTEM PRZECIĄGANIA DOTYKOWEGO (MYSZ + DOTYK)
        function zainicjujDragAndDrop() {
            const container = document.getElementById('tiles-container');
            const tiles = container.querySelectorAll('.route-tile');

            tiles.forEach(tile => {
                // Obsługa myszy (PC)
                tile.addEventListener('dragstart', () => tile.classList.add('dragging'));
                tile.addEventListener('dragend', () => {
                    tile.classList.remove('dragging');
                    przebudujTablicePoPrzeciagnieciu();
                });

                // Gładka obsługa dotykowa (Smartfony)
                tile.addEventListener('touchstart', (e) => {
                    if (e.target.classList.contains('btn-tile-delete')) return;
                    tile.classList.add('dragging');
                    tile.style.position = 'relative';
                }, { passive: true });

                tile.addEventListener('touchmove', (e) => {
                    const draggingTile = container.querySelector('.route-tile.dragging');
                    if (!draggingTile) return;

                    const touch = e.touches[0];
                    const pozycjePoza = pobierzElementPozaPrzeciaganym(container, touch.clientY);

                    if (pozycjePoza == null) {
                        container.appendChild(draggingTile);
                    } else {
                        container.insertBefore(draggingTile, pozycjePoza);
                    }
                }, { passive: true });

                tile.addEventListener('touchend', () => {
                    if (tile.classList.contains('dragging')) {
                        tile.classList.remove('dragging');
                        przebudujTablicePoPrzeciagnieciu();
                    }
                });
            });

            container.addEventListener('dragover', e => {
                e.preventDefault();
                const draggingTile = document.querySelector('.dragging');
                if (!draggingTile) return;
                const pozycjaPoza = pobierzElementPozaPrzeciaganym(container, e.clientY);
                if (pozycjaPoza == null) {
                    container.appendChild(draggingTile);
                } else {
                    container.insertBefore(draggingTile, pozycjaPoza);
                }
            });
        }

        function pobierzElementPozaPrzeciaganym(container, y) {
            const elementyNiedragging = [...container.querySelectorAll('.route-tile:not(.dragging)')];
            return elementyNiedragging.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function przebudujTablicePoPrzeciagnieciu() {
            const container = document.getElementById('tiles-container');
            const aktualneKafelki = [...container.querySelectorAll('.route-tile')];
            
            const nowaKolejnosc = aktualneKafelki.map(tile => {
                const id = tile.getAttribute('data-id');
                return punktyTrasy.find(p => p.id === id);
            });

            punktyTrasy = nowaKolejnosc;
            renderujTrase(false); // Blokada przerysowania DOM zapobiega ucinaniu animacji
            renderujSameBadges(); // Natychmiast przelicza badge START / META
        }

        function renderujSameBadges() {
            const kafelki = document.querySelectorAll('.route-tile');
            kafelki.forEach((tile, index) => {
                const badge = tile.querySelector('.tile-badge');
                if (badge) {
                    badge.className = "tile-badge";
                    if (index === 0) {
                        badge.innerText = "START";
                        badge.classList.add('badge-start');
                    } else if (index === kafelki.length - 1 && kafelki.length > 1) {
                        badge.innerText = "META";
                        badge.classList.add('badge-meta');
                    } else {
                        badge.innerText = "P" + (index + 1);
                    }
                }
            });
        }

        // RENDEROWANIE SYSTEMU
        function renderujTrase(odswiezBlokiHTML = true) {
            const container = document.getElementById('tiles-container');
            
            if (odswiezBlokiHTML) {
                container.innerHTML = "";
                punktyTrasy.forEach((punkt, index) => {
                    let etykieta = "P" + (index + 1);
                    let dodatkowaKlasa = "";
                    if (index === 0) { etykieta = "START"; dodatkowaKlasa = "badge-start"; }
                    if (index === punktyTrasy.length - 1 && punktyTrasy.length > 1) { etykieta = "META"; dodatkowaKlasa = "badge-meta"; }

                    const tile = document.createElement('div');
                    tile.className = "route-tile";
                    tile.setAttribute('draggable', 'true');
                    tile.setAttribute('data-id', punkt.id);
                    tile.innerHTML = `
                        <span class="tile-drag-handle">☰</span>
                        <span class="tile-badge ${dodatkowaKlasa}">${etykieta}</span>
                        <span class="tile-name">${punkt.nazwa}</span>
                        <button class="btn-tile-delete" onclick="usunPunkt(${index}); event.stopPropagation();">❌</button>
                    `;
                    container.appendChild(tile);
                });
                zainicjujDragAndDrop();
            }

            if (punktyTrasy.length > 0) {
                ukryjOpcjeKreatora();
            } else {
                document.getElementById('creator-title').innerText = "WYBIERZ PUNKT POCZĄTKOWY TRASY:";
                document.getElementById('creator-box').style.display = 'flex';
                document.getElementById('btn-add-step').style.display = 'none';
            }

            const distanceText = document.getElementById('route-distance');
            const googleLink = document.getElementById('btn-google-maps');

            if (punktyTrasy.length >= 2) {
                distanceText.innerHTML = `⏳ Kalkulowanie drogi...`;
                const query = punktyTrasy.map(p => `${p.lng},${p.lat}`).join(';');
                
                fetch(`https://router.project-osrm.org/route/v1/driving/${query}?overview=full&geometries=geojson`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.code === 'Ok' && data.routes.length > 0) {
                            if (liniaTrasy) map.removeLayer(liniaTrasy);
                            const trasa = data.routes[0];
                            const m = Math.round(trasa.duration / 60);
                            const h = Math.floor(m / 60);
                            distanceText.innerHTML = `🚗 Razem: <strong>${(trasa.distance / 1000).toFixed(1)} km</strong> (ok. <strong>${h > 0 ? h + 'h ' + (m % 60) + 'min' : m + ' min'}</strong>)`;
                            
                            liniaTrasy = L.polyline(trasa.geometry.coordinates.map(c => [c[1], c[0]]), {
                                color: '#6f42c1', weight: 5, opacity: 0.85
                            }).addTo(map);
                        } else {
                            distanceText.innerHTML = `⚠️ Brak dróg dojazdowych.`;
                        }
                    }).catch(() => distanceText.innerHTML = `⚠️ Błąd mapowania.`);

                let origin = `${punktyTrasy[0].lat},${punktyTrasy[0].lng}`;
                let destination = `${punktyTrasy[punktyTrasy.length - 1].lat},${punktyTrasy[punktyTrasy.length - 1].lng}`;
                let waypoints = punktyTrasy.length > 2 ? punktyTrasy.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|') : "";
                
                googleLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints ? '&waypoints=' + waypoints : ''}&travelmode=driving`;
                googleLink.style.display = "block";
            } else {
                if (liniaTrasy) map.removeLayer(liniaTrasy);
                distanceText.innerHTML = punktyTrasy.length === 1 ? `Dodaj drugi punkt, by poznać trasę...` : `Uzupełnij punkty trasy...`;
                googleLink.style.display = "none";
            }
        }

        function zamknijIResetuj() {
            punktyTrasy = [];
            if (liniaTrasy) map.removeLayer(liniaTrasy);
            document.getElementById('route-panel').classList.remove('active');
            document.getElementById('btn-trigger-plan').style.display = 'flex';
        }

        let userMarker = null;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    aktualneWspolrzedneGps = { lat, lng };

                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        userMarker = L.marker([lat, lng], {
                            icon: L.divIcon({ className: 'user-location-marker', iconSize: [14, 14], iconAnchor: [7, 7] })
                        }).addTo(map);
                    }
                },
                (err) => console.log(err.message),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        if (punktyDoKadrowania.length > 0) map.fitBounds(punktyDoKadrowania, { padding: [40, 40] });
    </script>
</body>
</html>
