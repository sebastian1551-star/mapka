<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mapa Projektów ENPROM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{--bg:#fff;--panel:#fff;--panel-2:#f4f4f4;--border:#d0d0d0;--text:#1a1a1a;--dim:#666;--pin:#3a3a3a;--danger:#b00020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
#map{width:100%;height:100vh;height:100dvh;position:relative;z-index:1}

.marker-pin{border-radius:50% 50% 50% 0;border:2px solid #fff;width:30px;height:30px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;background:var(--pin);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.marker-pin .marker-glyph{transform:rotate(45deg);font-size:12px;font-weight:700;color:#fff}
.pin-staly{background:#000}
.projekt-nieaktywny{opacity:.4!important;filter:grayscale(100%)}

.cluster-pin{width:38px;height:38px;border-radius:50%;background:#555;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.4)}

.map-label-centered{background:none!important;border:none!important;box-shadow:none!important;text-align:center;pointer-events:none}
.label-pill{display:inline-block;background:rgba(255,255,255,.9);border:1px solid #bbb;color:#111;font-weight:600;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.map-label-centered.label-nieaktywna .label-pill{opacity:.5}

#top-bar{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:998;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#search-box{pointer-events:auto;flex:1;max-width:320px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);outline:none;box-shadow:0 1px 5px rgba(0,0,0,.25)}
#btn-view{pointer-events:auto;background:#fff;border:1px solid var(--border);color:var(--text);height:42px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25);white-space:nowrap}
#btn-legend{pointer-events:auto;background:#fff;border:1px solid var(--border);color:var(--text);width:42px;height:42px;min-width:42px;border-radius:8px;font-size:16px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25)}
#legend-panel{position:absolute;top:60px;right:10px;z-index:998;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;width:190px;box-shadow:0 2px 10px rgba(0,0,0,.3);display:none}
#legend-panel.active{display:block}
#legend-panel h4{margin:0 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.legend-sep{height:1px;background:var(--border);margin:8px 0}

#btn-trigger-plan{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:999;background:#fff;border:1px solid #888;color:var(--text);padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;gap:7px}
#route-count-badge{background:#333;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;display:none}

#route-panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:92vw;transform:translateX(100%);transition:transform .25s ease;background:#fff;border-left:1px solid var(--border);box-shadow:-2px 0 12px rgba(0,0,0,.15);padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:1000;display:flex;flex-direction:column;overflow-y:auto}
#route-panel.active{transform:none}
body.panel-open:not(.mobile) #map{width:calc(100% - 340px)}body.panel-open:not(.mobile) #top-bar{right:350px}body.panel-open:not(.mobile) #legend-panel{right:350px}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-title{font-size:13px;font-weight:700}
.panel-hint{font-size:11px;color:var(--dim);text-align:center;margin-bottom:8px}

.route-tiles-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:80px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;padding:2px}
.route-tiles-scroll:empty::after{content:"Brak punktów — dotknij lokalizację na mapie";display:block;text-align:center;color:var(--dim);font-size:12px;padding:16px 6px}

.btn-plain{background:#fff;border:1px solid #888;color:var(--text);border-radius:8px;padding:11px 10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center}
.btn-plain:active{background:#e8e8e8}
.btn-loc{width:100%;margin-bottom:10px}

.route-tile{display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;gap:6px;user-select:none}
.tile-main-row{display:flex;align-items:center;gap:8px}
.tile-staff-row{display:flex;gap:4px;border-top:1px dashed var(--border);padding-top:6px}
.tile-staff-contact{flex:1;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 7px;font-size:11px;color:#333;text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.tile-staff-contact span.staff-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sortable-ghost{opacity:.3;background:#ddd!important}
.tile-drag-handle{color:#888;font-size:18px;cursor:grab;padding:4px 6px;touch-action:none}
.tile-badge{font-size:10px;font-weight:700;background:#fff;padding:3px 7px;border-radius:5px;color:#111;border:1px solid #999;min-width:40px;text-align:center;flex-shrink:0}
.tile-name{font-size:13px;font-weight:600;flex-grow:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-tile-delete{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:4px 6px;flex-shrink:0}

.panel-distance{font-size:13px;font-weight:600;background:var(--panel-2);border:1px solid var(--border);margin-bottom:8px;padding:10px;border-radius:8px;text-align:center}

.route-link-box{display:none;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--panel-2)}
.route-link-box.active{display:block}
.route-link-label{font-size:12px;font-weight:700;margin-bottom:6px}
.route-link-url{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--dim);background:#fff;border:1px solid var(--border);border-radius:6px;padding:7px 9px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-link-main{display:flex;gap:8px}
.route-link-main .btn-plain{flex:1;padding:14px 8px;font-size:14px}

.btn-clear-route{background:none;border:none;color:var(--danger);font-size:12px;margin-top:6px;width:100%;cursor:pointer;font-weight:600;padding:6px}

.user-location-marker{background:#222;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.2)}

.leaflet-tooltip.custom-tooltip{background:#fff;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:inherit;width:230px;max-width:230px;white-space:normal;pointer-events:auto}
.tooltip-title{font-weight:700;font-size:13.5px;margin-bottom:4px}
.tooltip-status{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-bottom:5px;border:1px solid #999;color:#333}
.tooltip-row{font-size:12px;color:#444;margin-top:3px}
.tooltip-row a{color:#111;font-weight:600}
.tooltip-hint{font-size:10.5px;color:var(--dim);margin-top:6px;padding-top:5px;border-top:1px dashed var(--border)}
.btn-toggle-list{display:none;background:#fff;border:1px solid #888;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
body.mobile #search-box{font-size:16px;max-width:none}
body.mobile #route-panel{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;transform:translateY(100%);border-left:none;border-top:1px solid var(--border);border-radius:14px 14px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.25);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));max-height:70vh}
body.mobile #route-panel.active{transform:none}
body.mobile .panel-header{order:0;margin-bottom:6px;gap:8px}
body.mobile .panel-header .panel-title{flex:1}
body.mobile .btn-toggle-list{display:inline-block}
body.mobile .panel-distance{order:1;margin-bottom:8px;padding:8px;font-size:13px}
body.mobile .route-link-box{order:2;padding:0;border:none;background:none;margin-bottom:0}
body.mobile .route-link-label,body.mobile .route-link-url{display:none}
body.mobile .route-link-main .btn-plain{padding:14px 8px;font-size:15px}
body.mobile .panel-hint{order:3;display:none;margin-top:10px}
body.mobile .btn-loc{order:4;display:none;margin-top:0}
body.mobile .route-tiles-scroll{order:5;display:none;flex:none;max-height:34vh}
body.mobile #route-panel.expanded .panel-hint,body.mobile #route-panel.expanded .btn-loc{display:block}
body.mobile #route-panel.expanded .btn-loc{display:flex}
body.mobile #route-panel.expanded .route-tiles-scroll{display:flex}
body.mobile .btn-clear-route{display:none}
body.mobile .tile-staff-contact{padding:10px 8px;font-size:12px}
body.mobile body.panel-open .leaflet-bottom{margin-bottom:150px}
body.mobile body.panel-expanded .leaflet-bottom{display:none}
body.mobile .leaflet-tooltip.custom-tooltip{width:min(230px,70vw)}
</style>
</head>

<div id="map"></div>
<div id="top-bar">

  <button id="btn-view" onclick="przelaczWidok()">📱 Mobilna</button>
  <button id="btn-legend" onclick="przelaczLegende()">ℹ️</button>
</div>
<div id="legend-panel">
  <h4>Typ obiektu</h4>
  <div class="legend-row"><b>LN</b> Linia</div>

  <div class="legend-row"><b>UW</b> Rozdzielnia zagr.</div>
  <div class="legend-row"><b>LK / LE</b> Linia kablowa / energetyczna</div>
  <div class="legend-sep"></div>
  <h4>Status</h4>
  <div class="legend-row">Ciemna pinezka — aktywny</div>
  <div class="legend-row">Blada pinezka — nieaktywny</div>

</div>
<button id="btn-trigger-plan" onclick="otworzPlaner()">🗺️ Wyznacz trasę <span id="route-count-badge">0</span></button>

<div id="route-panel">
  <div class="panel-header">
    <span class="panel-title">Planer trasy</span>
    <button class="btn-toggle-list" id="btn-toggle-list" onclick="przelaczListe()">Punkty (<span id="list-count">0</span>) ▲</button>
    <button class="btn-tile-delete" style="font-size:20px;" onclick="zamknijIResetuj()">✖</button>
  </div>
  <div class="route-link-box" id="route-link-box">
    <div class="route-link-label" id="route-link-label">Link</div>
    <div class="route-link-url" id="route-link-url">—</div>
    <div class="route-link-main">
      <button class="btn-plain" id="btn-copy-route" onclick="skopiujLinkTrasy()">Kopiuj link</button>
      <a href="#" target="_blank" class="btn-plain" id="btn-open-route">Otwórz trasę</a>
    </div>
  </div>
  <div class="panel-hint">Dotknij punkt na mapie, aby dodać go do trasy</div>
  <button class="btn-plain btn-loc" id="btn-add-me" onclick="dodajMojaLokalizacje()">📍 Start z mojej lokalizacji</button>
  <div class="route-tiles-scroll" id="tiles-container"></div>
  <div class="panel-distance" id="route-distance">Kliknij punkt na mapie...</div>
  <button class="btn-clear-route" onclick="zamknijIResetuj()">Zamknij / Resetuj planer</button>
</div>

 { id: 30, typ: "LN", status: "aktywne", nazwa: "SE JEDLICZE", etykieta: "220919 SE JEDLICZE", lat: 49.711281, lng: 21.655624, kierownik: "Mateusz Podsiadło", telKierownik: "504561609", bhp: "", telBhp: "", mail: "" }
 { id: 31, typ: "SE", status: "aktywne", nazwa: "Magazyn GmbH Frankfurt", etykieta: "Magazyn GmbH Frankfurt", lat:  52.290917, lng: 14.478861, kierownik: "", telKierownik: "", bhp: "", telBhp: "", mail: "" },
 { id: 32, typ: "SE", status: "aktywne", nazwa: "", etykieta: "Słupsk Stacja", lat: 54.501247, lng: 16.891565, kierownik: "Michał Matuszak", telKierownik: "+48 502 310 139", bhp: "", telBhp: "", mail: "" },
];

function stworzIkone(p) {
    const klasa = p.status === "staly" ? "marker-pin pin-staly" : "marker-pin";
    return L.divIcon({
        html: `<div class="${klasa}"><div class="marker-glyph">${p.id === 13 ? "⌂" : (p.id === 12 ? "M" : p.typ)}</div></div>`,
        className: p.status === "nieaktywne" ? "projekt-nieaktywny" : "",
        iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28]
    });
}

let punktyTrasy = [];
let liniaTrasy = null;
const punktyDoKadrowania = [];
const markerRefs = {};
const labelRefs = {};

const clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 55, disableClusteringAtZoom: 10, spiderfyOnMaxZoom: true, showCoverageOnHover: false,
    iconCreateFunction: c => L.divIcon({ html: `<div class="cluster-pin"><span>${c.getChildCount()}</span></div>`, className: "", iconSize: [38, 38] })
});
map.addLayer(clusterGroup);
const labelsGroup = L.layerGroup().addTo(map);

function budujDymekHtml(p) {
    const pm = p.kierownik ? `<div class="tooltip-row">👤 <b>PM:</b> ${p.kierownik}${p.telKierownik ? ' · <a href="tel:' + p.telKierownik + '">' + p.telKierownik + '</a>' : ''}</div>` : "";
    const bhp = p.bhp ? `<div class="tooltip-row">🛡️ <b>BHP:</b> ${p.bhp}${p.telBhp ? ' · <a href="tel:' + p.telBhp + '">' + p.telBhp + '</a>' : ''}</div>` : "";
    const mail = p.mail ? `<div class="tooltip-row">✉️ <a href="mailto:${p.mail}">${p.mail}</a></div>` : "";
    const status = p.status === "nieaktywne" ? "nieaktywny" : (p.status === "staly" ? "punkt stały" : "aktywny");
    return `<div class="tooltip-title">${p.nazwa}</div><span class="tooltip-status">${status}</span>${pm}${bhp}${mail}<div class="tooltip-hint">dotknij pinezkę, aby dodać do trasy</div>`;
}

projekty.forEach(p => {
    punktyDoKadrowania.push([p.lat, p.lng]);
    const marker = L.marker([p.lat, p.lng], { icon: stworzIkone(p) });
    marker.bindTooltip(budujDymekHtml(p), { direction: 'top', offset: [0, -28], opacity: 1, sticky: false, interactive: true, className: 'custom-tooltip' });
    marker.on('click', () => { dodajDoTrasyZId(p.id); marker.closeTooltip(); });
    clusterGroup.addLayer(marker);
    markerRefs[p.id] = marker;

    const tekst = p.status === "staly" ? p.etykieta : `${p.typ}: ${p.etykieta}`;
    const label = L.marker([p.lat, p.lng], {
        icon: L.divIcon({
            className: `map-label-centered ${p.status === 'nieaktywne' ? 'label-nieaktywna' : ''}`,
            html: `<div class="label-pill">${tekst}</div>`, iconAnchor: [75, -8], iconSize: [150, 18]
        }),
        interactive: false
    });
    labelsGroup.addLayer(label);
    labelRefs[p.id] = label;
});

if (punktyDoKadrowania.length > 0) map.fitBounds(punktyDoKadrowania, { padding: [40, 40] });

function aktualizujWidocznoscEtykiet() {
    if (map.getZoom() < 7) { if (map.hasLayer(labelsGroup)) map.removeLayer(labelsGroup); }
    else if (!map.hasLayer(labelsGroup)) labelsGroup.addTo(map);
}
map.on('zoomend', aktualizujWidocznoscEtykiet);
aktualizujWidocznoscEtykiet();

// Dowolny punkt na mapie
const customMarkers = {};
map.on('click', e => dodajPunktNiestandardowy(e.latlng));

function dodajPunktNiestandardowy(latlng) {
    const customId = "custom_" + Date.now();
    const marker = L.circleMarker(latlng, { radius: 8, color: '#fff', weight: 2, fillColor: '#222', fillOpacity: 0.95 }).addTo(map);
    marker.bindTooltip("📍 Punkt niestandardowy", { direction: 'top', offset: [0, -10], className: 'custom-tooltip' });
    customMarkers[customId] = marker;

    punktyTrasy.push({ id: customId, dbId: null, nazwa: `Punkt (${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)})`, lat: latlng.lat, lng: latlng.lng, kierownik: "", telKierownik: "", bhp: "", telBhp: "", mail: "" });

    if (!document.getElementById('route-panel').classList.contains('active')) otworzPlaner(); else renderujTrase();

    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}&zoom=14`, { headers: { 'Accept-Language': 'pl' } })
        .then(r => r.json())
        .then(data => {
            const punkt = punktyTrasy.find(p => p.id === customId);
            if (!punkt) return;
            const a = data.address || {};
            const nazwa = a.village || a.town || a.city || a.suburb || a.county || (data.display_name ? data.display_name.split(',')[0] : null);
            if (nazwa) { punkt.nazwa = "📍 " + nazwa; renderujTrase(); }
        }).catch(() => {});
}

// Wyszukiwarka
function filtrujProjekty(zapytanie) {
    const q = zapytanie.trim().toLowerCase();
    projekty.forEach(p => {
        const pasuje = !q || p.nazwa.toLowerCase().includes(q) || p.etykieta.toLowerCase().includes(q) || p.typ.toLowerCase().includes(q);
        const marker = markerRefs[p.id];
        const el = labelRefs[p.id].getElement();
        if (pasuje) { if (!clusterGroup.hasLayer(marker)) clusterGroup.addLayer(marker); }
        else if (clusterGroup.hasLayer(marker)) clusterGroup.removeLayer(marker);
        if (el) el.style.display = pasuje ? "" : "none";
    });
}
function ustawEtykieteWidoku() {
    const m = document.body.classList.contains('mobile');
    document.getElementById('btn-view').innerText = m ? '🖥 Komputer' : '📱 Mobilna';
}
function przelaczWidok() {
    document.body.classList.toggle('mobile');
    ustawEtykieteWidoku();
    map.invalidateSize();
}
if (window.innerWidth < 700) document.body.classList.add('mobile');
ustawEtykieteWidoku();

function przelaczLegende() { document.getElementById('legend-panel').classList.toggle('active'); }

// Planer trasy
const container = document.getElementById('tiles-container');
Sortable.create(container, { animation: 200, handle: '.tile-drag-handle', ghostClass: 'sortable-ghost', onEnd: przebudujTablicePoPrzeciagnieciu });

function otworzPlaner() {
    document.getElementById('btn-trigger-plan').style.display = 'none';
    document.getElementById('route-panel').classList.add('active');
    document.body.classList.add('panel-open');
    map.invalidateSize();
    renderujTrase();
}

function aktualizujBadgeLiczby() {
    const b = document.getElementById('route-count-badge');
    b.style.display = punktyTrasy.length > 0 ? 'inline-block' : 'none';
    b.innerText = punktyTrasy.length;
    document.getElementById('list-count').innerText = punktyTrasy.length;
}

function przelaczListe() {
    const rozwinieta = document.getElementById('route-panel').classList.toggle('expanded');
    document.body.classList.toggle('panel-expanded', rozwinieta);
    document.getElementById('btn-toggle-list').innerHTML = `Punkty (<span id="list-count">${punktyTrasy.length}</span>) ${rozwinieta ? '▼' : '▲'}`;
}

function dodajDoTrasyZId(id) {
    const prj = projekty.find(p => p.id === id);
    if (!prj) return;
    if (punktyTrasy.some(p => p.dbId === id)) { if (markerRefs[id]) markerRefs[id].closeTooltip(); return; }
    punktyTrasy.push({ id: "prj_" + Date.now() + "_" + id, dbId: prj.id, nazwa: prj.nazwa, lat: prj.lat, lng: prj.lng, kierownik: prj.kierownik || "Brak", telKierownik: prj.telKierownik || "", bhp: prj.bhp || "Brak", telBhp: prj.telBhp || "", mail: prj.mail || "" });
    if (markerRefs[id]) markerRefs[id].closeTooltip();
    if (!document.getElementById('route-panel').classList.contains('active')) otworzPlaner(); else renderujTrase();
}

function usunPunkt(index) {
    const punkt = punktyTrasy[index];
    if (punkt && customMarkers[punkt.id]) { map.removeLayer(customMarkers[punkt.id]); delete customMarkers[punkt.id]; }
    punktyTrasy.splice(index, 1);
    renderujTrase();
}

function przebudujTablicePoPrzeciagnieciu() {
    const nowa = [];
    container.querySelectorAll('.route-tile').forEach(tile => {
        const p = punktyTrasy.find(x => x.id === tile.getAttribute('data-id'));
        if (p) nowa.push(p);
    });
    punktyTrasy = nowa;
    renderujTrase();
}

function renderujTrase() {
    container.innerHTML = "";
    punktyTrasy.forEach((punkt, index) => {
        let etykieta = "P" + (index + 1);
        if (index === 0) etykieta = "START";
        if (index === punktyTrasy.length - 1 && punktyTrasy.length > 1) etykieta = "META";

        const pmHtml = punkt.telKierownik
            ? `<a href="tel:${punkt.telKierownik}" class="tile-staff-contact">👤 <span class="staff-name">PM: ${punkt.kierownik}</span> <span>📞</span></a>`
            : `<div class="tile-staff-contact">👤 <span class="staff-name">PM: ${punkt.kierownik}</span></div>`;
        const bhpHtml = punkt.telBhp
            ? `<a href="tel:${punkt.telBhp}" class="tile-staff-contact">🛡️ <span class="staff-name">BHP: ${punkt.bhp}</span> <span>📞</span></a>`
            : `<div class="tile-staff-contact">🛡️ <span class="staff-name">BHP: ${punkt.bhp}</span></div>`;
        const mailHtml = punkt.mail ? `<a href="mailto:${punkt.mail}" class="tile-staff-contact">✉️ <span class="staff-name">${punkt.mail}</span></a>` : "";
        const brak = !punkt.telKierownik && !punkt.telBhp && !punkt.mail && (!punkt.kierownik || punkt.kierownik === "Brak") && (!punkt.bhp || punkt.bhp === "Brak");
        const staff = brak ? "" : `<div class="tile-staff-row">${pmHtml}${bhpHtml}</div>${mailHtml ? `<div class="tile-staff-row">${mailHtml}</div>` : ""}`;

        const tile = document.createElement('div');
        tile.className = "route-tile";
        tile.setAttribute('data-id', punkt.id);
        tile.innerHTML = `<div class="tile-main-row">
            <span class="tile-drag-handle">☰</span>
            <span class="tile-badge">${etykieta}</span>
            <span class="tile-name">${punkt.nazwa}</span>
            <button class="btn-tile-delete" onclick="usunPunkt(${index}); event.stopPropagation();">❌</button>
        </div>${staff}`;
        container.appendChild(tile);
    });
    aktualizujBadgeLiczby();
    przeliczTraseFetch();
}

function aktualizujBoxLinku() {
    const box = document.getElementById('route-link-box');
    if (punktyTrasy.length === 0) { box.classList.remove('active'); return null; }
    let url, opis;
    if (punktyTrasy.length === 1) {
        const p = punktyTrasy[0];
        url = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
        opis = `Link do punktu: ${p.nazwa}`;
    } else {
        const o = punktyTrasy[0], d = punktyTrasy[punktyTrasy.length - 1];
        const wp = punktyTrasy.length > 2 ? punktyTrasy.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|') : "";
        url = `https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}${wp ? '&waypoints=' + wp : ''}&travelmode=driving`;
        opis = `Link do trasy (${punktyTrasy.length} pkt)`;
    }
    document.getElementById('route-link-label').innerText = opis;
    document.getElementById('route-link-url').innerText = url;
    document.getElementById('btn-open-route').href = url;
    box.classList.add('active');
    return url;
}

function przeliczTraseFetch() {
    const dt = document.getElementById('route-distance');
    aktualizujBoxLinku();
    if (punktyTrasy.length >= 2) {
        dt.innerHTML = `⏳ Kalkulowanie drogi...`;
        const query = punktyTrasy.map(p => `${p.lng},${p.lat}`).join(';');
        fetch(`https://router.project-osrm.org/route/v1/driving/${query}?overview=full&geometries=geojson`)
            .then(r => r.json())
            .then(data => {
                if (data.code === 'Ok' && data.routes.length > 0) {
                    if (liniaTrasy) map.removeLayer(liniaTrasy);
                    const t = data.routes[0];
                    const m = Math.round(t.duration / 60), h = Math.floor(m / 60);
                    dt.innerHTML = `Razem: <strong>${(t.distance / 1000).toFixed(1)} km</strong> · ok. <strong>${h > 0 ? h + 'h ' + (m % 60) + 'min' : m + ' min'}</strong>`;
                    liniaTrasy = L.polyline(t.geometry.coordinates.map(c => [c[1], c[0]]), { color: '#222', weight: 5, opacity: 0.85 }).addTo(map);
                    const mobilny = document.body.classList.contains('mobile');
                    map.fitBounds(liniaTrasy.getBounds(), { paddingTopLeft: [30, mobilny ? 70 : 50], paddingBottomRight: [30, mobilny ? 200 : 50] });
                } else dt.innerHTML = `⚠️ Brak dróg dojazdowych.`;
            }).catch(() => dt.innerHTML = `⚠️ Błąd połączenia trasy.`);
    } else if (punktyTrasy.length === 1) {
        if (liniaTrasy) map.removeLayer(liniaTrasy);
        dt.innerHTML = `Link do punktu gotowy — skopiuj powyżej`;
    } else {
        if (liniaTrasy) map.removeLayer(liniaTrasy);
        dt.innerHTML = `Kliknij punkt na mapie, by zacząć...`;
    }
}

function skopiujLinkTrasy() {
    const url = document.getElementById('route-link-url').innerText;
    const btn = document.getElementById('btn-copy-route');
    if (!url || url === '—') return;
    const ok = () => { btn.innerText = '✓ Skopiowano'; setTimeout(() => btn.innerText = 'Kopiuj link', 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok).catch(() => kopiujFallback(url, ok));
    else kopiujFallback(url, ok);
}
function kopiujFallback(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
}

function zamknijIResetuj() {
    Object.keys(customMarkers).forEach(id => { map.removeLayer(customMarkers[id]); delete customMarkers[id]; });
    punktyTrasy = [];
    if (liniaTrasy) map.removeLayer(liniaTrasy);
    document.getElementById('route-panel').classList.remove('active');
    document.body.classList.remove('panel-open', 'panel-expanded');
    document.getElementById('route-panel').classList.remove('expanded');
    document.getElementById('btn-toggle-list').innerHTML = `Punkty (<span id="list-count">0</span>) ▲`;
    map.invalidateSize();
    document.getElementById('btn-trigger-plan').style.display = 'flex';
    aktualizujBadgeLiczby();
}

// Geolokalizacja
let userMarker = null;
if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
        const ll = [pos.coords.latitude, pos.coords.longitude];
        if (userMarker) userMarker.setLatLng(ll);
        else userMarker = L.marker(ll, { icon: L.divIcon({ className: 'user-location-marker', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 })
            .addTo(map).bindTooltip("📍 Tu jesteś", { direction: 'top', offset: [0, -10], className: 'custom-tooltip' });
    }, err => console.log(err.message), { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
}

function dodajMojaLokalizacje() {
    if (!navigator.geolocation) { alert("Twoja przeglądarka nie wspiera geolokalizacji."); return; }
    navigator.geolocation.getCurrentPosition(pos => {
        if (punktyTrasy.some(p => p.dbId === "me")) return;
        punktyTrasy.unshift({ id: "me_" + Date.now(), dbId: "me", nazwa: "Moja Lokalizacja", lat: pos.coords.latitude, lng: pos.coords.longitude, kierownik: "", telKierownik: "", bhp: "", telBhp: "", mail: "" });
        renderujTrase();
    }, () => alert("Nie można pobrać lokalizacji. Włącz GPS/Zezwól na lokalizację."));
}
</script>
</body>
</html>
