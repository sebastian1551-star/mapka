<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Projektów ENPROM</title>
    <style>
        /* Reset marginesów, aby mapa zajmowała 100% ekranu bez białych ramek */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Główny kontener mapy */
        .map-container {
            position: relative;
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Osadzona mapa Google */
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Półprzezroczysty dymek nad mapą (środek-góra ekranu) */
        .project-selector-box {
            position: absolute;
            top: 70px; /* Bezpieczna odległość od paska wyszukiwania Google */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9); /* Eleganckie, półprzezroczyste białe tło */
            backdrop-filter: blur(8px); /* Efekt rozmycia szkła za dymkiem */
            -webkit-backdrop-filter: blur(8px);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            z-index: 9999;
            width: 85%;
            max-width: 340px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.4);
            text-align: center;
        }

        .project-selector-box label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        /* Wybór projektu - ładny select */
        .styled-select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #007bff;
            border-radius: 10px;
            background-color: white;
            color: #333;
            outline: none;
            cursor: pointer;
        }

        /* Kontener na przyciski wewnątrz dymka */
        .contact-buttons {
            display: none; /* Ukryte, dopóki użytkownik nie wybierze projektu */
            margin-top: 12px;
            flex-direction: column;
            gap: 8px;
        }

        /* Wygląd przycisków telefonicznych */
        .phone-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .phone-btn:active {
            transform: scale(0.96);
        }

        /* Dynamiczne kolory */
        .kierownik { background-color: #007bff; }
        .bhp { background-color: #28a745; }

        /* Styl dla opisu pod przyciskami */
        .project-name-display {
            font-size: 14px;
            font-weight: bold;
            color: #222;
            margin-bottom: 4px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="map-container">
        
        <!-- Półprzezroczysty dymek z wyborem projektu -->
        <div class="project-selector-box">
            <label for="project-choice">Wybierz lokalizację projektu</label>
            <select id="project-choice" class="styled-select" onchange="updateContacts()">
                <option value="">-- Wybierz projekt --</option>
                <option value="boleslawiec">Bolesławiec</option>
                <option value="rokitnica">Ząbkowice Śląskie (Rokitnica)</option>
            </select>

            <!-- Sekcja z telefonami, która zmienia się dynamicznie -->
            <div id="contact-section" class="contact-buttons">
                <span id="current-project-title" class="project-name-display"></span>
                
                <a id="link-kierownik" href="tel:" class="phone-btn kierownik">
                    📞 Kierownik: <span id="num-kierownik"></span>
                </a>
                <a id="link-bhp" href="tel:" class="phone-btn bhp">
                    ⛑️ BHP: <span id="num-bhp"></span>
                </a>
            </div>
        </div>

        <!-- Twoja działająca mapa Google -->
        <iframe src="https://www.google.com/maps/d/embed?mid=1-2Vs42j6F7k_9QnRxIeFYqiakHP8wHw&ehbc=2E312F" allowfullscreen="" loading="lazy"></iframe>

    </div>

    <script>
        // Baza danych projektów - tutaj możesz łatwo zmieniać numery telefonów
        const projectData = {
            boleslawiec: {
                title: "Projekt Bolesławiec",
                kierownik: "+48111222333", // Wpisz właściwy numer
                bhp: "+48444555666"        // Wpisz właściwy numer
            },
            rokitnica: {
                title: "Projekt ZRokitnica",
                kierownik: "+48777888999", // Wpisz właściwy numer
                bhp: "+48000111222"        // Wpisz właściwy numer
            }
        };

        function updateContacts() {
            const select = document.getElementById('project-choice');
            const container = document.getElementById('contact-section');
            const selectedValue = select.value;

            if (selectedValue && projectData[selectedValue]) {
                const data = projectData[selectedValue];
                
                // Aktualizacja tekstów i linków w dymku
                document.getElementById('current-project-title').innerText = data.title;
                
                document.getElementById('link-kierownik').href = "tel:" + data.kierownik;
                document.getElementById('num-kierownik').innerText = data.kierownik;
                
                document.getElementById('link-bhp').href = "tel:" + data.bhp;
                document.getElementById('num-bhp').innerText = data.bhp;
                
                // Pokazanie przycisków
                container.style.display = 'flex';
            } else {
                // Ukrycie przycisków, jeśli nic nie wybrano
                container.style.display = 'none';
            }
        }
    </script>

</body>
</html>
