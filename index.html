<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Projektów ENPROM</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
        }

        #map {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* TŁO I STYL POPUPÓW W KLIMACIE DARK MODE Z TWOJEGO SCREENA */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 15, 15, 0.95) !important;
            border: 1px solid #333;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 4px;
            color: #fff;
        }
        .leaflet-popup-tip { background: rgba(15, 15, 15, 0.95) !important; }

        .popup-container {
            text-align: center;
            min-width: 230px;
        }

        .popup-title {
            font-size: 14px;
            font-weight: bold;
            color: #24ff56;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .status-badge {
            font-size: 10px;
            font-weight: bold;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            background-color: #222;
            color: #aaa;
            border: 1px solid #444;
        }
        .status-staly { color: #ffc107; border-color: #ffc107; }

        .popup-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            padding: 11px;
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .kierownik { background-color: #0056b3; }
        .nawiguj { background-color: #b88600; }
        
        /* NOWY PROSTY PRZYCISK DODAWANIA W POPUPIE */
        .btn-dodaj-punkt {
            background-color: #28a745;
            width: 100%;
        }
        .btn-dodaj-punkt:active { background-color: #1e7e34; }

        .custom-tooltip {
            background: rgba(20, 20, 20, 0.9) !important;
            border: 1px solid #444 !important;
            color: #fff !important;
            font-weight: 600;
            font-size: 10px;
            border-radius: 4px;
            padding: 2px 6px;
        }

        .user-location-marker {
            background: #007bff;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.7);
        }

        /* SUBTELNE PRZYCISKI SKRÓTÓW NA MAPIE */
        .map-floating-controls {
            position: absolute;
            top: 110px;
            left: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-floating-shortcut {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(4px);
            color: #fff;
            border: 1px solid #444;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* LATAJĄCY PRZYCISK: ZAPLANUJ TRASĘ */
        #btn-trigger-plan {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #444;
            color: #24ff56;
            padding: 14px 26px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* PANEL TRASY ZGODNY Z TWOIM CZARNYM DESIGNEM UI */
        #route-panel {
            position: absolute;
            bottom: -500px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 430px;
            background: rgba(15, 15, 15, 0.98);
            border: 1px solid #333;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 14px;
            z-index: 1000;
            transition: bottom 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
            box-sizing: border-box;
            color: #fff;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        #route-panel.active {
            bottom: 15px;
        }

        /* KONTENER DYNAMICZNYCH KAFELKÓW */
        .route-tiles-scroll {
            overflow-y: auto;
            max-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            padding-right: 4px;
        }

        .route-tile {
            display: flex;
            align-items: center;
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
        }

        .tile-badge {
            font-size: 10px;
            font-weight: bold;
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        .tile-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tile-actions {
            display: flex;
            gap: 4px;
        }

        .btn-tile-action {
            background: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-tile-action.delete { background: #551a1a; border-color: #772222; }

        /* SEKCJA ROZWIJANEJ LISTY PROJEKTÓW DO SZYBKIEGO WYBORU */
        .quick-select-container {
            margin-bottom: 12px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #333;
            padding: 4px;
        }

        .quick-select-menu {
            width: 100%;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .panel-distance {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: #5c2bab;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .btn-go-route {
            background: #218838;
            color: white;
            text-align: center;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(33, 136, 56, 0.4);
        }
        
        .btn-clear-route {
            background: none;
            border: none;
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="map">
        <div class="map-floating-controls">
            <button class="btn-floating-shortcut" onclick="dodajGpsBezpośrednio()" title="Wrzuć moją pozycję do trasy">📍</button>
            <button class="btn-floating-shortcut" onclick="dodajSiedzibeBezpośrednio()" title="Wrzuć Siedzibę do trasy">🏢</button>
        </div>
    </div>

    <button id="btn-trigger-plan" onclick="otworzPlaner()">🗺️ Zaplanuj trasę (<span id="btn-count">0</span>)</button>

    <div id="route-panel">
        <div class="route-tiles-scroll" id="tiles-container">
            </div>

        <div class="quick-select-container">
            <select class="quick-select-menu" id="select-project-picker" onchange="wybranoZListy(this)">
                <option value="" disabled selected>📋 Szybkie dodawanie z listy...</option>
                </select>
        </div>

        <div class="panel-distance" id="route-distance">Dodaj punkty, aby obliczyć drogę...</div>
        <a href="#" target="_blank" class="btn-go-route" id="btn-google-maps" style="display:none;">🚗 Wyznacz tę trasę w Google Maps</a>
        <button class="btn-clear-route" onclick="zamknijIResetuj()">❌ Zamknij / Resetuj trasę</button>
    </div>

    <script>
        // Inicjalizacja podstawowa mapy
        const map = L.map('map', { zoomSnap: 0.5 });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        function stworzIkone(typ, status) {
            let url = "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png";
            if (typ === "SE") url = "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png";
            return L.icon({
                iconUrl: url, iconSize: [22, 36], iconAnchor: [11, 36], popupAnchor: [1, -30],
                className: status === "nieaktywne" ? "projekt-nieaktywny" : ""
            });
        }

        // Baza punktów i projektów
        const projekty = [
            { id: 1, typ: "LN", status: "aktywne", nazwa: "110 KV Bolesławiec - Świętoszów", etykieta: "244312 Bolesławiec", lat: 51.287194, lng: 15.594056 },
            { id: 2, typ: "SE", status: "aktywne", nazwa: "SE 400/110 kV Rokitnica", etykieta: "245165 Rokitnica", lat: 50.372361, lng: 18.771306 },
            { id: 3, typ: "LN", status: "aktywne", nazwa: "Linia 110/220 kV CPK", etykieta: "CPK", lat: 52.209911, lng: 20.475766 },
            { id: 4, typ: "SE", status: "aktywne", nazwa: "SE Leszno", etykieta: "Leszno", lat: 51.877000, lng: 16.589056 },
            { id: 5, typ: "SE", status: "aktywne", nazwa: "SE Polkowice", etykieta: "Polkowice", lat: 51.496195, lng: 16.073803 },
            { id: 6, typ: "LN", status: "nieaktywne", nazwa: "Linia 110 kV Radzyń - Łuków", etykieta: "Radzyń", lat: 51.777073, lng: 22.622897 },
            { id: 7, typ: "UW", status: "aktywne", nazwa: "UW Siebenbäumen (Siedenbrunzow)", etykieta: "Siebenbrunzow", lat: 53.907861, lng: 13.144389 },
            { id: 8, typ: "UW", status: "nieaktywne", nazwa: "UW Semlin", etykieta: "Semlin", lat: 53.147361, lng: 11.758278 },
            { id: 9, typ: "UW", status: "aktywne", nazwa: "UW Jesow", etykieta: "Jesow", lat: 53.389861, lng: 11.016417 },
            { id: 10, typ: "LN", status: "aktywne", nazwa: "LN Demon Munstenberg", etykieta: "Munstenberg", lat: 52.597977, lng: 13.623709 },
            { id: 11, typ: "LN", status: "aktywne", nazwa: "LN Trębaczew", etykieta: "Trębaczew", lat: 50.4571478, lng: 18.5353028 },
            { id: 12, typ: "LN", status: "staly", nazwa: "Magazyn Centralny", etykieta: "Magazyn Centralny", lat: 51.9420371, lng: 20.6014463 },
            { id: 13, typ: "SE", status: "staly", nazwa: "Siedziba", etykieta: "Siedziba", lat: 52.1402252, lng: 21.0153614 },
            { id: 14, typ: "WF", status: "aktywne", nazwa: "Baltic Power", etykieta: "Baltic Power", lat: 54.7717892, lng: 17.9058547 },
            { id: 15, typ: "WF", status: "aktywne", nazwa: "Bałtyk II&III", etykieta: "Bałtyk II&III", lat: 54.5432722, lng: 16.8494375 }
        ];

        // TABLICA PRZECHOWUJĄCA AKTUALNĄ TRASĘ (DOWOLNA ILOŚĆ PUNKTÓW)
        let punktyTrasy = [];
        let liniaTrasy = null;
        let aktualneWspolrzedneGps = null;
        const punktyDoKadrowania = [];

        // Generowanie markerów i rozwijanej listy
        const picker = document.getElementById('select-project-picker');
        
        projekty.forEach(projekt => {
            punktyDoKadrowania.push([projekt.lat, projekt.lng]);

            // Dodanie do rozwijalnej listy na dole
            const opt = document.createElement('option');
            opt.value = projekt.id;
            opt.innerText = (projekt.status === 'staly' ? '📌 ' : '') + projekt.nazwa;
            picker.appendChild(opt);

            let statusTekst = projekt.status === "staly" ? "📌 PUNKT STAŁY" : (projekt.status === "aktywne" ? "🟢 W REALIZACJI" : "⚠️ UKOŃCZONO");
            
            // NOWY PROSTY POPUP: TYLKO JEDEN DUŻY PRZYCISK Z PLUSIKIEM
            const popupContent = `
                <div class="popup-container">
                    <div class="popup-title">${projekt.nazwa}</div>
                    <div class="status-badge status-${projekt.status}">${statusTekst}</div>
                    <a href="tel:${projekt.telKierownik || ''}" class="popup-btn kierownik">📞 Kontakt</a>
                    <button class="popup-btn btn-dodaj-punkt" onclick="dodajDoTrasyZId(${projekt.id})">➕ Dodaj do trasy</button>
                </div>
            `;

            const marker = L.marker([projekt.lat, projekt.lng], {
                icon: stworzIkone(projekt.typ, projekt.status),
                draggable: true
            }).addTo(map);

            // Obsługa przesunięcia palcem markera na mapie aktualizuje trasę
            marker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                projekt.lat = pos.lat;
                projekt.lng = pos.lng;
                
                // Przepisujemy zmienione pozycje w aktywnej trasie
                punktyTrasy.forEach(p => {
                    if (p.id === projekt.id) {
                        p.lat = pos.lat;
                        p.lng = pos.lng;
                    }
                });
                renderujTrase();
            });

            marker.bindTooltip((projekt.status === "staly" || projekt.typ === "WF") ? projekt.etykieta : `${projekt.typ}: ${projekt.etykieta}`, {
                permanent: true, direction: 'top', className: "custom-tooltip", offset: [0, -6]
            });
            marker.bindPopup(popupContent);
        });

        // FUNKCJE OBSŁUGI TRASY
        function otworzPlaner() {
            document.getElementById('btn-trigger-plan').style.display = 'none';
            document.getElementById('route-panel').classList.add('active');
            
            // Jeśli trasa była zupełnie pusta, wrzucamy domyślnie Twoją pozycję na start
            if (punktyTrasy.length === 0 && aktualneWspolrzedneGps) {
                dodajGpsBezpośrednio();
            } else {
                renderujTrase();
            }
        }

        function dodajDoTrasyZId(id) {
            const projekt = projekty.find(p => p.id === id);
            if (projekt) {
                punktyTrasy.push(Object.assign({}, projekt)); // kopia obiektu
                map.closePopup();
                otworzPlaner();
            }
        }

        function wybranoZListy(select) {
            if (!select.value) return;
            dodajDoTrasyZId(parseInt(select.value));
            select.value = ""; // reset menu wyboru
        }

        function dodajGpsBezpośrednio() {
            if (aktualneWspolrzedneGps) {
                punktyTrasy.push({
                    id: "gps_" + Date.now(),
                    nazwa: "Twoja lokalizacja (GPS)",
                    lat: aktualneWspolrzedneGps.lat,
                    lng: aktualneWspolrzedneGps.lng
                });
                renderujTrase();
            } else {
                alert("Brak sygnału GPS. Sprawdź uprawnienia do lokalizacji.");
            }
        }

        function dodajSiedzibeBezpośrednio() {
            const siedziba = projekty.find(p => p.id === 13);
            if (siedziba) {
                punktyTrasy.push(Object.assign({ id: "siedziba_" + Date.now() }, siedziba));
                renderujTrase();
            }
        }

        // AKCJE NA KAFELKACH (ZAMIANA KOLEJNOŚCI / USUNĄĆ)
        function przesunWTrasie(index, kierunek) {
            let docelowy = index + kierunek;
            if (docelowy >= 0 && docelowy < punktyTrasy.length) {
                let temp = punktyTrasy[index];
                punktyTrasy[index] = punktyTrasy[docelowy];
                punktyTrasy[docelowy] = temp;
                renderujTrase();
            }
        }

        function usunPunkt(index) {
            punktyTrasy.splice(index, 1);
            renderujTrase();
        }

        // REDEROWANIE LISTY I GENEROWANIE LINKU GOOGLE MAPS MULTI-DESTINATION
        function renderujTrase() {
            const container = document.getElementById('tiles-container');
            container.innerHTML = "";
            
            document.getElementById('btn-count').innerText = punktyTrasy.length;

            punktyTrasy.forEach((punkt, index) => {
                let tag = "P" + (index + 1);
                if (index === 0) tag = "START";
                if (index === punktyTrasy.length - 1 && punktyTrasy.length > 1) tag = "META";

                const tile = document.createElement('div');
                tile.className = "route-tile";
                tile.innerHTML = `
                    <span class="tile-badge">${tag}</span>
                    <span class="tile-name">${punkt.nazwa}</span>
                    <div class="tile-actions">
                        ${index > 0 ? `<button class="btn-tile-action" onclick="przesunWTrasie(${index}, -1)">🔼</button>` : ''}
                        ${index < punktyTrasy.length - 1 ? `<button class="btn-tile-action" onclick="przesunWTrasie(${index}, 1)">🔽</button>` : ''}
                        <button class="btn-tile-action delete" onclick="usunPunkt(${index})">❌</button>
                    </div>
                `;
                container.appendChild(tile);
            });

            const distanceText = document.getElementById('route-distance');
            const googleLink = document.getElementById('btn-google-maps');

            if (punktyTrasy.length >= 2) {
                distanceText.innerHTML = `⏳ Przeliczanie drogi wielopunktowej...`;
                const query = punktyTrasy.map(p => `${p.lng},${p.lat}`).join(';');
                
                fetch(`https://router.project-osrm.org/route/v1/driving/${query}?overview=full&geometries=geojson`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.code === 'Ok' && data.routes.length > 0) {
                            if (liniaTrasy) map.removeLayer(liniaTrasy);
                            const trasa = data.routes[0];
                            
                            const m = Math.round(trasa.duration / 60);
                            const h = Math.floor(m / 60);
                            const czasTekst = h > 0 ? `${h} godz. ${m % 60} min` : `${m} min`;

                            distanceText.innerHTML = `🚗 Łącznie: <strong>${(trasa.distance / 1000).toFixed(1)} km</strong> (ok. <strong>${czasTekst}</strong>)`;
                            
                            liniaTrasy = L.polyline(trasa.geometry.coordinates.map(c => [c[1], c[0]]), {
                                color: '#6f42c1', weight: 5, opacity: 0.85
                            }).addTo(map);
                        } else {
                            distanceText.innerHTML = `⚠️ Brak dróg łączących punkty.`;
                        }
                    }).catch(() => distanceText.innerHTML = `⚠️ Błąd sieci.`);

                // Budowanie linku wielopunktowego Google Maps
                let origin = `${punktyTrasy[0].lat},${punktyTrasy[0].lng}`;
                let destination = `${punktyTrasy[punktyTrasy.length - 1].lat},${punktyTrasy[punktyTrasy.length - 1].lng}`;
                
                let waypoints = "";
                if (punktyTrasy.length > 2) {
                    waypoints = punktyTrasy.slice(1, -1).map(p => `${p.lat},${p.lng}`).join('|');
                }
                
                googleLink.href = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypoints ? '&waypoints=' + waypoints : ''}&travelmode=driving`;
                googleLink.style.display = "block";
            } else {
                if (liniaTrasy) map.removeLayer(liniaTrasy);
                distanceText.innerHTML = `Wybierz min. 2 punkty na trasie...`;
                googleLink.style.display = "none";
            }
        }

        function zamknijIResetuj() {
            punktyTrasy = [];
            if (liniaTrasy) map.removeLayer(liniaTrasy);
            document.getElementById('route-panel').classList.remove('active');
            document.getElementById('btn-trigger-plan').style.display = 'flex';
            document.getElementById('btn-count').innerText = 0;
        }

        // OBSŁUGA POZYCJI GPS TELEFONU
        let userMarker = null;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    aktualneWspolrzedneGps = { lat, lng };

                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        userMarker = L.marker([lat, lng], {
                            icon: L.divIcon({ className: 'user-location-marker', iconSize: [14, 14], iconAnchor: [7, 7] })
                        }).addTo(map);
                        userMarker.bindTooltip("Twoja obecna pozycja", { direction: 'top', className: 'custom-tooltip' });
                    }
                },
                (err) => console.log(err.message),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        if (punktyDoKadrowania.length > 0) map.fitBounds(punktyDoKadrowania, { padding: [40, 40] });
    </script>
</body>
</html>
